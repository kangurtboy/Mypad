name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required project files
        shell: bash
        run: |
          test -f AGENTS.md
          test -f README.md
          test -f docs/ROADMAP.md
          test -f docs/ARCHITECTURE.md
          echo "Documentation structure validated."

# Add Windows build and test jobs after Phase 0 selects and commits
# the exact .NET SDK, Windows App SDK, and project structure.
